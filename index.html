<!DOCTYPE html>
<html>
<head>
    <title>我的第一个网站</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            margin: 50px auto;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }
        button {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.3s;
        }
        button:hover {
            transform: scale(1.05);
        }
        .time {
            font-size: 14px;
            margin-top: 30px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 恭喜！</h1>
        <h2>我的GitHub网站成功上线了！</h2>
        <p>这是我用GitHub Pages创建的第一个网站</p>
        <button onclick="alert('🎈 欢迎来到我的网站！')">点击我试试</button>
        <div class="time" id="time"></div>
    </div>
    
    <script>
        // 显示当前时间
        function showTime() {
            const now = new Date();
            document.getElementById('time').innerHTML = '网站创建时间：' + now.toLocaleString();
        }
        showTime();
    </script>
</body>
</html>
